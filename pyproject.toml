[project]
name = "lexus-hunter-workspace"
version = "0.1.0"
description = "Local development environment for lexus-hunter"
requires-python = ">=3.11"
dependencies = ["lexus-hunter"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.13,<1", "mypy>=1.18,<2", "types-PyYAML>=6,<7"]

[tool.uv]
package = false

[tool.uv.sources]
lexus-hunter = { path = "package", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
