[build-system]
requires = ["flit_core>=3.11,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "lexus-hunter"
version = "0.1.0"
description = "Read-only California Lexus ES 300h listing research CLI"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.28,<0.29",
  "openai>=2.54,<3",
  "playwright>=1.50,<2",
  "pydantic>=2.12,<3",
  "python-dotenv>=1.1,<2",
  "PyYAML>=6,<7",
]

[project.scripts]
lexus-hunter = "lexus_hunter.cli:main"
